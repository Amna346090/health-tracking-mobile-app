version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: health_tracking_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthpassword}
      POSTGRES_DB: ${POSTGRES_DB:-healthtracking}
    ports:
      - "5433:5432"  # use 5433 externally if 5432 is taken by a local Postgres install
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
